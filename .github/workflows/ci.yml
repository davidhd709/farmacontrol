name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Monorepo Quality Gate
    runs-on: ubuntu-latest

    # Las pruebas crean su propio PostgreSQL temporal con Docker (pnpm test, FARM-AUD-014):
    # mismo mecanismo de aislamiento que en local, sin servicio compartido.
    env:
      NODE_ENV: test
      # Solo para prisma generate/validate; ninguna etapa se conecta a esta URL
      DATABASE_URL: postgresql://prisma:prisma@127.0.0.1:1/prisma_validate?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # La prueba de respaldos ejecuta pg_dump real contra el PostgreSQL 18 temporal: el cliente
      # de la imagen del runner es anterior y pg_dump se niega a volcar un servidor más nuevo.
      - name: Install PostgreSQL 18 client (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL client version
        run: |
          pg_dump --version
          pg_dump --version | grep -Eq '\(PostgreSQL\) (1[89]|[2-9][0-9])\.'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Prisma Validate
        run: pnpm db:validate

      - name: Build Monorepo
        run: pnpm build


      - name: Lint Code
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Run Automated Tests (PostgreSQL temporal)
        run: pnpm test
