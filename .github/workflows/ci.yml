name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Monorepo Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: farmacia_ci_user
          POSTGRES_PASSWORD: farmacia_ci_password_testing_only
          POSTGRES_DB: farmacia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmacia_ci_user -d farmacia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://farmacia_ci_user:farmacia_ci_password_testing_only@localhost:5432/farmacia_test?schema=public
      DATABASE_TEST_URL: postgresql://farmacia_ci_user:farmacia_ci_password_testing_only@localhost:5432/farmacia_test?schema=public
      # infra/scripts/backup.sh lee la conexión de las variables estándar de libpq
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: farmacia_ci_user
      PGPASSWORD: farmacia_ci_password_testing_only
      PGDATABASE: farmacia_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # Las pruebas de respaldos ejecutan pg_dump/pg_restore contra PostgreSQL 18;
      # el cliente que trae el runner es más antiguo y pg_dump rechaza servidores
      # de versión mayor.
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Show PostgreSQL client version
        run: pg_dump --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma Generate
        run: pnpm db:generate

      - name: Prisma Validate
        run: pnpm db:validate

      - name: Apply Migrations to Test Database
        run: pnpm db:test:migrate

      - name: Build Monorepo
        run: pnpm build


      - name: Lint Code
        run: pnpm lint

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Run Automated Tests
        run: pnpm test
