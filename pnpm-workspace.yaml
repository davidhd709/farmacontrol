packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/engines': true
  # Telemetría postinstall de swagger-ui-dist: no se ejecuta.
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true

# Parches de seguridad en dependencias transitivas (pnpm audit, 2026-10-10 y 2026-11-15).
# Versiones exactas: la mínima parcheada con al menos dos semanas de publicada.
overrides:
  body-parser: 2.4.0
  fast-uri: 3.1.9
  js-yaml: 5.4.1
  multer: 2.5.0
  mysql2: ^3.24.5
  qs: 6.16.2
  source-map-js: ^1.2.2
  undici: 8.12.3
  vite: 6.4.5
